SPDX-FileCopyrightText = "2026 Sebastian Ritter"
SPDX-License-Identifier = "Apache-2.0"

# Das Projekt nutzt für Quelltext per Default die Apache-2.0 Lizenz, wenn nichts Anderes angegeben ist (closest)
[[annotations]]
path = ["Sources/**", "Tests/**"]
precedence = "closest"
SPDX-FileCopyrightText = "2026 Sebastian Ritter"
SPDX-License-Identifier = "Apache-2.0"

# Diese Datei `reuse.toml` und die Dokumentation werden ohne Lizenz daher Creative Commons Zero freigegeben, soweit nichts Anderes angegeben ist (closest)
